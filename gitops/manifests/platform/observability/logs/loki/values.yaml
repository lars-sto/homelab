deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 7d
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_query_lookback: 7d

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Keep the in-cluster service name used by Grafana and Alloy:
# http://loki-gateway.observability.svc.cluster.local
gateway:
  enabled: true

# SingleBinary mode must not run the distributed/read-write components.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Keep the homelab footprint small. These caches are useful at scale, but they
# add extra pods and memory pressure that are unnecessary for this dev cluster.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Avoid creating synthetic canary traffic in the homelab/dev cluster.
lokiCanary:
  enabled: false

test:
  enabled: false
