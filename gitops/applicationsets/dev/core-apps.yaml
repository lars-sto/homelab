apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-git-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          - appName: namespaces
            syncWave: "0"
            repoURL: https://github.com/lars-sto/homelab.git
            targetRevision: main
            path: gitops/manifests/namespaces
            destNamespace: default

          - appName: platform-storage-local-path-provisioner
            syncWave: "15"
            repoURL: https://github.com/lars-sto/homelab.git
            targetRevision: main
            path: gitops/manifests/platform/storage/local-path-provisioner
            destNamespace: local-path-storage

          - appName: platform-argocd-infra
            syncWave: "20"
            repoURL: https://github.com/lars-sto/homelab.git
            targetRevision: main
            path: gitops/manifests/platform/argocd
            destNamespace: argocd

          - appName: apps-demo
            syncWave: "50"
            repoURL: https://github.com/lars-sto/homelab.git
            targetRevision: main
            path: gitops/manifests/workloads/demo
            destNamespace: apps

          - appName: service-calculator
            syncWave: "50"
            repoURL: https://github.com/lars-sto/homelab.git
            targetRevision: main
            path: gitops/manifests/services/calculator
            destNamespace: apps

  template:
    metadata:
      name: '{{ .appName }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: default
      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .targetRevision }}'
        path: '{{ .path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .destNamespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-ingress-nginx
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - appName: platform-ingress-nginx
            syncWave: "10"
  template:
    metadata:
      name: "{{appName}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
    spec:
      project: default
      source:
        repoURL: https://kubernetes.github.io/ingress-nginx
        chart: ingress-nginx
        targetRevision: 4.11.0
        helm:
          releaseName: ingress-nginx
          values: |
            controller:
              admissionWebhooks:
                enabled: true
              service:
                type: NodePort
                nodePorts:
                  http: 30080
                  https: 30443
      destination:
        server: https://kubernetes.default.svc
        namespace: ingress-nginx
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true